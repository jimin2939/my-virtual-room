<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D 가상 공간 채팅방</title>
  <style>
    body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; color: white; font-family: sans-serif; padding-bottom: 30px; }
    canvas { background: #2d3748; border: 3px solid #4a5568; margin-top: 15px; border-radius: 8px; cursor: pointer; }
    
    /* 채팅창 스타일 */
    #chat-container { width: 1200px; max-width: 95vw; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    #chat-log { 
      height: 140px; background: #2d3748; border: 1px solid #4a5568; border-radius: 6px; 
      padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; 
    }
    .chat-item { line-height: 1.4; word-break: break-all; }
    .chat-time { font-size: 11px; color: #a0aec0; margin-right: 6px; }
    .chat-name { font-weight: bold; color: #63b3ed; }
    
    #chat-box { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; }
    button { padding: 10px 20px; border-radius: 6px; border: none; background: #4299e1; color: white; cursor: pointer; font-weight: bold; }

    /* 입장 모달 팝업 */
    #login-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #2d3748; padding: 30px; border-radius: 12px; text-align: center; width: 450px; max-width: 90vw;
    }
    .char-container {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 15px 0; max-height: 220px; overflow-y: auto; padding: 10px;
    }
    .char-option {
      width: 65px; height: 65px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; object-fit: cover; background: #fff;
    }
    .char-option.selected { border-color: #4299e1; transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="login-modal">
    <div class="modal-content">
      <h2 style="margin-top:0;">입장하기</h2>
      <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" style="width: 80%; margin-bottom: 15px;" />
      
      <p style="margin-bottom: 5px;">캐릭터 선택</p>
      <div class="char-container">
        <img src="./치이카와.png" class="char-option selected" onclick="selectChar(this, './치이카와.png')" />
        <img src="./하치와레.png" class="char-option" onclick="selectChar(this, './하치와레.png')" />
        <img src="./우사기.png" class="char-option" onclick="selectChar(this, './우사기.png')" />
        <img src="./모몬가.png" class="char-option" onclick="selectChar(this, './모몬가.png')" />
        <img src="./쿠리만쥬.png" class="char-option" onclick="selectChar(this, './쿠리만쥬.png')" />
        <img src="./씨사.png" class="char-option" onclick="selectChar(this, './씨사.png')" />
        <img src="./rakko.png" class="char-option" onclick="selectChar(this, './rakko.png')" />
        <img src="./카니.png" class="char-option" onclick="selectChar(this, './카니.png')" />
        <img src="./메인.jpg" class="char-option" onclick="selectChar(this, './메인.jpg')" />
      </div>

      <button onclick="joinGame()" style="margin-top: 15px; width: 100%;">시작하기</button>
    </div>
  </div>

  <h2>🎮 2D 가상 모임 공간</h2>
  <p>방향키(WASD / 화살표)로 이동하거나 맵을 클릭하세요!</p>
  
  <canvas id="gameCanvas" width="1200" height="800"></canvas>

  <div id="chat-container">
    <div id="chat-log"></div>
    <div id="chat-box">
      <input type="text" id="msgInput" placeholder="메시지를 입력하고 Enter를 누르세요..." />
      <button onclick="sendMsg()">전송</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgInput = document.getElementById('msgInput');
    const chatLog = document.getElementById('chat-log');

    let players = {};
    let myPos = { x: 600, y: 400 };
    let selectedImgSrc = './치이카와.png';
    let imageCache = {};

    function getLoadedImage(src) {
      if (!imageCache[src]) {
        const img = new Image();
        img.src = src;
        img.onload = () => draw();
        imageCache[src] = img;
      }
      return imageCache[src];
    }

    function selectChar(element, imgSrc) {
      document.querySelectorAll('.char-option').forEach(img => img.classList.remove('selected'));
      element.classList.add('selected');
      selectedImgSrc = imgSrc;
    }

    function joinGame() {
      const name = document.getElementById('nicknameInput').value.trim() || '익명';
      socket.emit('join', { name: name, character: selectedImgSrc });
      document.getElementById('login-modal').style.display = 'none';
    }

    // 접속 시 이전 3일 치 대화 내역 일괄 로드
    socket.on('loadHistory', (history) => {
      chatLog.innerHTML = '';
      history.forEach(data => appendChatMessage(data));
    });

    socket.on('updatePlayers', (serverPlayers) => {
      players = serverPlayers;
      draw();
    });

    // 실시간 메시지 수신
    socket.on('newMessage', (data) => {
      appendChatMessage(data);
    });

    function appendChatMessage(data) {
      const item = document.createElement('div');
      item.className = 'chat-item';
      
      const dateStr = new Date(data.timestamp).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      item.innerHTML = `<span class="chat-time">[${dateStr}]</span> <span class="chat-name">${data.name}</span>: ${data.msg}`;
      
      chatLog.appendChild(item);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#7c9a63';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      for(let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for(let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      for (let id in players) {
        const p = players[id];
        const img = getLoadedImage(p.character || './치이카와.png');

        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, p.x - 25, p.y - 25, 50, 50);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(p.name || '익명', p.x, p.y + 42);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name || '익명', p.x, p.y + 42);

        // 말풍선 (p.msg가 존재할 때만 그리기)
        if (p.msg) {
          ctx.font = '14px sans-serif';
          const textWidth = ctx.measureText(p.msg).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(p.x - textWidth/2 - 8, p.y - 58, textWidth + 16, 26, 6);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.fillText(p.msg, p.x, p.y - 40);
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === msgInput || document.getElementById('login-modal').style.display !== 'none') return;
      const speed = 12;
      if (e.key === 'ArrowUp' || e.key === 'w') myPos.y = Math.max(25, myPos.y - speed);
      if (e.key === 'ArrowDown' || e.key === 's') myPos.y = Math.min(canvas.height - 25, myPos.y + speed);
      if (e.key === 'ArrowLeft' || e.key === 'a') myPos.x = Math.max(25, myPos.x - speed);
      if (e.key === 'ArrowRight' || e.key === 'd') myPos.x = Math.min(canvas.width - 25, myPos.x + speed);
      socket.emit('move', myPos);
    });

    canvas.addEventListener('click', (e) => {
      if (document.getElementById('login-modal').style.display !== 'none') return;
      const rect = canvas.getBoundingClientRect();
      myPos.x = e.clientX - rect.left;
      myPos.y = e.clientY - rect.top;
      socket.emit('move', myPos);
    });

    function sendMsg() {
      const text = msgInput.value.trim();
      if (text) {
        socket.emit('chatMessage', text);
        msgInput.value = '';
      }
    }

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
