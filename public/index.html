<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D 가상 공간 채팅방</title>
  <style>
    body { 
      margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; 
      color: white; font-family: sans-serif; padding: 10px 0; overflow-y: auto;
    }
    h2 { margin: 2px 0; font-size: 20px; }
    p { margin: 0 0 6px; font-size: 12px; color: #a0aec0; }

    #main-wrapper {
      width: 800px; max-width: 95vw; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    
    canvas { 
      width: 100%; height: auto; background: #2d3748; border: 2px solid #4a5568; 
      border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    #chat-container { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    #chat-log { 
      height: 90px; background: #2d3748; border: 1px solid #4a5568; border-radius: 6px; 
      padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; 
    }
    .chat-item { line-height: 1.3; word-break: break-all; }
    .chat-time { font-size: 11px; color: #a0aec0; margin-right: 6px; }
    .chat-name { font-weight: bold; color: #63b3ed; }
    
    #chat-box { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; outline: none; font-size: 13px; }
    button { padding: 8px 16px; border-radius: 6px; border: none; background: #4299e1; color: white; cursor: pointer; font-weight: bold; }

    #login-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #2d3748; padding: 20px; border-radius: 12px; text-align: center; width: 400px; max-width: 90vw;
    }
    .char-container {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; max-height: 180px; overflow-y: auto; padding: 5px;
    }
    .char-option {
      width: 55px; height: 55px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; object-fit: cover; background: #fff;
    }
    .char-option.selected { border-color: #4299e1; transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="login-modal">
    <div class="modal-content">
      <h2 style="margin-top:0;">입장하기</h2>
      <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" style="width: 80%; margin-bottom: 10px;" />
      
      <p style="margin-bottom: 5px;">캐릭터 선택</p>
      <div class="char-container">
        <img src="./치이카와.png" class="char-option selected" onclick="selectChar(this, './치이카와.png')" />
        <img src="./하치와레.png" class="char-option" onclick="selectChar(this, './하치와레.png')" />
        <img src="./우사기.png" class="char-option" onclick="selectChar(this, './우사기.png')" />
        <img src="./모몬가.png" class="char-option" onclick="selectChar(this, './모몬가.png')" />
        <img src="./쿠리만쥬.png" class="char-option" onclick="selectChar(this, './쿠리만쥬.png')" />
        <img src="./씨사.png" class="char-option" onclick="selectChar(this, './씨사.png')" />
        <img src="./락코.png" class="char-option" onclick="selectChar(this, './락코.png')" />
        <img src="./카니.png" class="char-option" onclick="selectChar(this, './카니.png')" />
        <img src="./메인.jpg" class="char-option" onclick="selectChar(this, './메인.jpg')" />
      </div>

      <button onclick="joinGame()" style="margin-top: 10px; width: 100%;">시작하기</button>
    </div>
  </div>

  <h2>🎮 2D 가상 모임 공간</h2>
  <p>이동: 방향키 / WASD | 채팅: Enter 키로 시작/전송 | 취소: ESC</p>

  <div id="main-wrapper">
    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div id="chat-container">
      <div id="chat-log"></div>
      <div id="chat-box">
        <input type="text" id="msgInput" placeholder="Enter 키를 누르면 채팅을 시작할 수 있습니다..." />
        <button onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgInput = document.getElementById('msgInput');
    const chatLog = document.getElementById('chat-log');

    let players = {};
    let myPos = { x: 400, y: 210 };
    let myName = '익명';
    let selectedImgSrc = './치이카와.png';
    let imageCache = {};

    function getLoadedImage(src) {
      if (!imageCache[src]) {
        const img = new Image();
        img.src = src;
        img.onload = () => draw();
        imageCache[src] = img;
      }
      return imageCache[src];
    }

    function selectChar(element, imgSrc) {
      document.querySelectorAll('.char-option').forEach(img => img.classList.remove('selected'));
      element.classList.add('selected');
      selectedImgSrc = imgSrc;
    }

    function joinGame() {
      const inputVal = document.getElementById('nicknameInput').value.trim();
      myName = inputVal !== '' ? inputVal : '익명';
      
      socket.emit('join', { name: myName, character: selectedImgSrc });
      document.getElementById('login-modal').style.display = 'none';
      canvas.focus();
    }

    socket.on('loadHistory', (history) => {
      chatLog.innerHTML = '';
      history.forEach(data => appendChatMessage(data));
    });

    socket.on('updatePlayers', (serverPlayers) => {
      players = serverPlayers;
      draw();
    });

    socket.on('newMessage', (data) => {
      appendChatMessage(data);
    });

    function appendChatMessage(data) {
      const item = document.createElement('div');
      item.className = 'chat-item';
      const dateStr = new Date(data.timestamp).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      item.innerHTML = `<span class="chat-time">[${dateStr}]</span> <span class="chat-name">${data.name}</span>: ${data.msg}`;
      chatLog.appendChild(item);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#7c9a63';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      for(let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for(let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      for (let id in players) {
        const p = players[id];
        const img = getLoadedImage(p.character || './치이카와.png');

        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, p.x - 20, p.y - 20, 40, 40);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(p.name || '익명', p.x, p.y + 34);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name || '익명', p.x, p.y + 34);

        if (p.msg) {
          ctx.font = '12px sans-serif';
          const textWidth = ctx.measureText(p.msg).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(p.x - textWidth/2 - 6, p.y - 48, textWidth + 12, 22, 5);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.fillText(p.msg, p.x, p.y - 33);
        }
      }
    }

    // 엔터키 및 ESC 키를 활용한 모드 전환 로직
    window.addEventListener('keydown', (e) => {
      // 모달창이 열려있으면 동작 안함
      if (document.getElementById('login-modal').style.display !== 'none') return;

      // Enter 키 눌렀을 때
      if (e.key === 'Enter') {
        if (document.activeElement !== msgInput) {
          // 이동 모드 -> 채팅 모드로 전환 (입력창에 포커스)
          e.preventDefault();
          msgInput.focus();
        } else {
          // 채팅 모드 -> 메시지 전송 후 이동 모드로 전환 (포커스 해제)
          e.preventDefault();
          sendMsg();
          msgInput.blur();
        }
        return;
      }

      // ESC 키 눌렀을 때 (채팅 모드 취소)
      if (e.key === 'Escape') {
        msgInput.blur();
        return;
      }

      // 채팅창에 포커스가 없을 때만 캐릭터 이동 가능
      if (document.activeElement !== msgInput) {
        const speed = 10;
        let moved = false;

        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { myPos.y = Math.max(20, myPos.y - speed); moved = true; }
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { myPos.y = Math.min(canvas.height - 20, myPos.y + speed); moved = true; }
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { myPos.x = Math.max(20, myPos.x - speed); moved = true; }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { myPos.x = Math.min(canvas.width - 20, myPos.x + speed); moved = true; }

        if (moved) {
          socket.emit('move', { x: myPos.x, y: myPos.y, name: myName, character: selectedImgSrc });
        }
      }
    });

    // 마우스 클릭 이동
    canvas.addEventListener('click', (e) => {
      if (document.getElementById('login-modal').style.display !== 'none') return;
      
      msgInput.blur(); // 캔버스 클릭 시 입력창 포커스 해제하여 즉시 이동 가능
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      myPos.x = (e.clientX - rect.left) * scaleX;
      myPos.y = (e.clientY - rect.top) * scaleY;
      
      socket.emit('move', { x: myPos.x, y: myPos.y, name: myName, character: selectedImgSrc });
    });

    function sendMsg() {
      const text = msgInput.value.trim();
      if (text) {
        socket.emit('chatMessage', text);
        msgInput.value = '';
      }
    }
  </script>
</body>
</html>
