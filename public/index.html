<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 화면 비율 자동 맞춤 태그 추가 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D 가상 공간 채팅방</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; 
      color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 10px; min-height: 100vh;
    }
    
    .header-area { 
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-bottom: 4px; width: 100%; max-width: 800px;
    }
    h2 { margin: 0; font-size: 18px; text-align: center; }
    p { margin: 0 0 8px; font-size: 11px; color: #a0aec0; text-align: center; }

    .room-change-select {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #4a5568; 
      background: #2d3748; color: white; font-size: 13px; font-weight: bold; cursor: pointer; outline: none;
    }

    #main-wrapper {
      width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    
    /* 캔버스 이미지 확대 시 픽셀이 깨지지 않고 뚜렷하게 보이도록 내장 옵션 처리 */
    canvas { 
      width: 100%; height: auto; background: #2d3748; border: 2px solid #4a5568; 
      border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    
    #chat-container { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    #chat-log { 
      height: 110px; background: #2d3748; border: 1px solid #4a5568; border-radius: 6px; 
      padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; 
    }
    .chat-item { display: flex; justify-content: space-between; align-items: center; line-height: 1.3; word-break: break-all; }
    .chat-time { font-size: 10px; color: #a0aec0; margin-right: 4px; }
    .chat-name { font-weight: bold; color: #63b3ed; }
    .delete-btn { color: #e53e3e; cursor: pointer; font-size: 12px; margin-left: 8px; font-weight: bold; border: none; background: none; padding: 2px 6px; }

    #chat-box { display: flex; gap: 6px; width: 100%; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; background: #ffffff; color: #000; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #4299e1; color: white; cursor: pointer; font-weight: bold; font-size: 14px; white-space: nowrap; }

    /* 모달 팝업 반응형 최적화 */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 15px;
    }
    .modal-content {
      background: #2d3748; padding: 20px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-content input { width: 100%; margin-bottom: 8px; padding: 10px; border-radius: 6px; border: none; font-size: 14px; }
    .char-container {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 10px 0; max-height: 140px; overflow-y: auto; padding: 5px;
    }
    .char-option {
      width: 48px; height: 48px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; object-fit: cover; background: #fff;
    }
    .char-option.selected { border-color: #4299e1; transform: scale(1.1); }
    .modal-select { padding: 10px; border-radius: 6px; border: none; margin-bottom: 10px; width: 100%; background: #fff; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 입장 모달 -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h2 style="margin-top:0;">입장하기</h2>
      <input type="text" id="nicknameInput" placeholder="닉네임" />
      <input type="text" id="statusInput" placeholder="한 줄 상태 메시지 (선택)" />
      <input type="text" id="bgmInput" placeholder="BGM 음원/유튜브 URL (선택)" />
      
      <p style="margin: 8px 0 2px;">접속할 방 선택</p>
      <select id="roomSelect" class="modal-select">
        <option value="로비">🏰 로비</option>
        <option value="수다방">💬 수다방</option>
        <option value="음악감상실">🎵 음악감상실</option>
      </select>

      <p style="margin: 8px 0 2px;">캐릭터 선택</p>
      <div class="char-container">
        <img src="./치이카와.png" class="char-option selected" onclick="selectChar(this, './치이카와.png')" />
        <img src="./하치와레.png" class="char-option" onclick="selectChar(this, './하치와레.png')" />
        <img src="./우사기.png" class="char-option" onclick="selectChar(this, './우사기.png')" />
        <img src="./모몬가.png" class="char-option" onclick="selectChar(this, './모몬가.png')" />
        <img src="./쿠리만쥬.png" class="char-option" onclick="selectChar(this, './쿠리만쥬.png')" />
        <img src="./씨사.png" class="char-option" onclick="selectChar(this, './씨사.png')" />
        <img src="./락코.png" class="char-option" onclick="selectChar(this, './락코.png')" />
        <img src="./카니.png" class="char-option" onclick="selectChar(this, './카니.png')" />
        <img src="./메인.jpg" class="char-option" onclick="selectChar(this, './메인.jpg')" />
      </div>

      <button onclick="joinGame()" style="width: 100%; margin-top: 8px;">시작하기</button>
    </div>
  </div>

  <!-- 프로필 보기 모달 -->
  <div id="profile-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 id="profName">유저 프로필</h3>
      <p id="profStatus" style="color: #63b3ed; font-size: 14px;"></p>
      <div id="profBgmArea" style="margin: 10px 0;"></div>
      <button onclick="closeProfile()" style="width: 100%;">닫기</button>
    </div>
  </div>

  <div class="header-area">
    <h2 id="roomTitle">🎮 2D 가상 공간</h2>
    <select id="headerRoomSelect" class="room-change-select" onchange="changeRoom(this.value)">
      <option value="로비">🏰 로비로 이동</option>
      <option value="수다방">💬 수다방으로 이동</option>
      <option value="음악감상실">🎵 음악감상실로 이동</option>
    </select>
  </div>
  <p>터치/클릭: 이동 및 프로필 보기 | PC: 방향키 & Enter 키</p>

  <div id="main-wrapper">
    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div id="chat-container">
      <div id="chat-log"></div>
      <div id="chat-box">
        <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." />
        <button onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgInput = document.getElementById('msgInput');
    const chatLog = document.getElementById('chat-log');

    let players = {};
    let myPos = { x: 400, y: 210 };
    let myName = '익명';
    let currentRoom = '로비';
    let selectedImgSrc = './치이카와.png';
    let imageCache = {};

    function getLoadedImage(src) {
      if (!imageCache[src]) {
        const img = new Image();
        img.src = src;
        img.onload = () => draw();
        imageCache[src] = img;
      }
      return imageCache[src];
    }

    function selectChar(element, imgSrc) {
      document.querySelectorAll('.char-option').forEach(img => img.classList.remove('selected'));
      element.classList.add('selected');
      selectedImgSrc = imgSrc;
    }

    function joinGame() {
      const inputVal = document.getElementById('nicknameInput').value.trim();
      myName = inputVal !== '' ? inputVal : '익명';
      currentRoom = document.getElementById('roomSelect').value;
      document.getElementById('headerRoomSelect').value = currentRoom;
      
      const statusMsg = document.getElementById('statusInput').value.trim();
      const bgmUrl = document.getElementById('bgmInput').value.trim();

      document.getElementById('roomTitle').innerText = `🎮 2D 가상 공간 - [${currentRoom}]`;

      socket.emit('join', { 
        name: myName, 
        character: selectedImgSrc, 
        room: currentRoom,
        statusMsg: statusMsg,
        bgmUrl: bgmUrl
      });
      document.getElementById('login-modal').style.display = 'none';
    }

    function changeRoom(newRoom) {
      if (newRoom === currentRoom) return;
      currentRoom = newRoom;
      document.getElementById('roomTitle').innerText = `🎮 2D 가상 공간 - [${currentRoom}]`;
      
      myPos = { x: 400, y: 210 };
      
      socket.emit('changeRoom', {
        room: currentRoom,
        name: myName,
        character: selectedImgSrc,
        x: myPos.x,
        y: myPos.y
      });
    }

    socket.on('loadHistory', (history) => {
      chatLog.innerHTML = '';
      history.forEach(data => appendChatMessage(data));
    });

    socket.on('updatePlayers', (serverPlayers) => {
      players = serverPlayers;
      draw();
    });

    socket.on('newMessage', (data) => {
      appendChatMessage(data);
    });

    socket.on('deleteMessage', (msgId) => {
      const target = document.getElementById(`msg-${msgId}`);
      if (target) target.remove();
    });

    function deleteMsg(msgId) {
      if (confirm('이 대화 내역을 지우시겠습니까?')) {
        socket.emit('deleteChatMessage', { msgId: msgId, room: currentRoom });
      }
    }

    function appendChatMessage(data) {
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.id = `msg-${data.id}`;
      const dateStr = new Date(data.timestamp).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      item.innerHTML = `
        <div>
          <span class="chat-time">[${dateStr}]</span> 
          <span class="chat-name">${data.name}</span>: ${data.msg}
        </div>
        <button class="delete-btn" onclick="deleteMsg('${data.id}')">✕</button>
      `;
      chatLog.appendChild(item);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function draw() {
      // 캔버스 이미지 확대 시 선명도 유지 처리
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#7c9a63';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      for(let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for(let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      for (let id in players) {
        const p = players[id];
        const img = getLoadedImage(p.character || './치이카와.png');

        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, p.x - 20, p.y - 20, 40, 40);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }

        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(p.name || '익명', p.x, p.y + 34);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name || '익명', p.x, p.y + 34);

        if (p.msg) {
          ctx.font = '12px sans-serif';
          const textWidth = ctx.measureText(p.msg).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(p.x - textWidth/2 - 6, p.y - 48, textWidth + 12, 22, 5);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.fillText(p.msg, p.x, p.y - 33);
        }
      }
    }

    // 마우스 클릭 및 터치 이동 처리
    function handleCanvasInteraction(e) {
      if (document.getElementById('login-modal').style.display !== 'none') return;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const clickX = (clientX - rect.left) * scaleX;
      const clickY = (clientY - rect.top) * scaleY;

      let clickedUser = null;
      for (let id in players) {
        const p = players[id];
        if (Math.hypot(p.x - clickX, p.y - clickY) < 28 && id !== socket.id) {
          clickedUser = p;
          break;
        }
      }

      if (clickedUser) {
        showProfile(clickedUser);
      } else {
        myPos.x = clickX;
        myPos.y = clickY;
        socket.emit('move', { x: myPos.x, y: myPos.y, name: myName, character: selectedImgSrc, room: currentRoom });
      }
    }

    canvas.addEventListener('click', handleCanvasInteraction);

    function showProfile(user) {
      document.getElementById('profName').innerText = `👤 ${user.name} 님의 프로필`;
      document.getElementById('profStatus').innerText = user.statusMsg || '설정된 한 줄 소개가 없습니다.';
      
      const bgmArea = document.getElementById('profBgmArea');
      if (user.bgmUrl) {
        bgmArea.innerHTML = `<a href="${user.bgmUrl}" target="_blank" style="color:#4299e1;">🎵 BGM 듣기 (링크 연결)</a>`;
      } else {
        bgmArea.innerHTML = '🎵 등록된 BGM이 없습니다.';
      }
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeProfile() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    window.addEventListener('keydown', (e) => {
      if (document.getElementById('login-modal').style.display !== 'none') return;

      if (e.key === 'Enter') {
        if (document.activeElement !== msgInput) {
          e.preventDefault();
          msgInput.focus();
        } else {
          e.preventDefault();
          sendMsg();
          msgInput.blur();
        }
        return;
      }

      if (e.key === 'Escape') {
        msgInput.blur();
        closeProfile();
        return;
      }

      if (document.activeElement !== msgInput) {
        const speed = 10;
        let moved = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { myPos.y = Math.max(20, myPos.y - speed); moved = true; }
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { myPos.y = Math.min(canvas.height - 20, myPos.y + speed); moved = true; }
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { myPos.x = Math.max(20, myPos.x - speed); moved = true; }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { myPos.x = Math.min(canvas.width - 20, myPos.x + speed); moved = true; }

        if (moved) {
          socket.emit('move', { x: myPos.x, y: myPos.y, name: myName, character: selectedImgSrc, room: currentRoom });
        }
      }
    });

    function sendMsg() {
      const text = msgInput.value.trim();
      if (text) {
        socket.emit('chatMessage', { msg: text, room: currentRoom });
        msgInput.value = '';
      }
    }

    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
